name: ci

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desktop tests (ASan/UBSan)
        run: make -C tests
      - name: Simulator smoke run
        run: make -C tools/sim run

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Build firmware
        run: pio run -d firmware -e xiao_esp32c3
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-firmware
          path: firmware/.pio/build/xiao_esp32c3/firmware.bin
