; Lumi firmware - build with `pio run`, flash with `pio run -t upload`,
; watch logs with `pio device monitor`.

[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_ldf_mode = deep+

; Generic ESP32-C3 SuperMini boards work too (add a TP4056 charger board).
[env:esp32c3_supermini]
extends = env:xiao_esp32c3
board = esp32-c3-devkitm-1
